<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>VideoFetch</title>

  <style>
    :root {
      color-scheme: dark;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system,
        BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #0b0d12;
      color: #f6f7fb;
      padding: 24px;
    }

    .card {
      width: min(720px, 100%);
      background: #141821;
      border: 1px solid #252b38;
      border-radius: 20px;
      padding: 28px;
      box-shadow: 0 20px 70px rgba(0, 0, 0, .35);
    }

    h1 {
      margin: 0 0 8px;
      font-size: clamp(30px, 6vw, 48px);
    }

    .sub {
      color: #aeb6c7;
      margin: 0 0 24px;
      line-height: 1.5;
    }

    label {
      display: block;
      font-size: 13px;
      color: #aeb6c7;
      margin: 14px 0 7px;
    }

    input {
      width: 100%;
      background: #0d1118;
      color: white;
      border: 1px solid #30384a;
      padding: 14px 15px;
      border-radius: 12px;
      outline: none;
      font-size: 15px;
    }

    input:focus {
      border-color: #7b8cff;
    }

    .actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 14px;
    }

    button {
      border: 0;
      border-radius: 12px;
      padding: 14px 16px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
    }

    button:disabled {
      cursor: wait;
      opacity: .6;
    }

    .info-btn {
      background: #242a38;
      color: white;
    }

    .download-btn {
      background: #f6f7fb;
      color: #0b0d12;
    }

    .status {
      min-height: 24px;
      margin-top: 16px;
      color: #cbd2df;
      font-size: 14px;
      white-space: pre-wrap;
    }

    .preview {
      display: none;
      margin-top: 18px;
      grid-template-columns: 150px 1fr;
      gap: 14px;
      align-items: center;
    }

    .preview.show {
      display: grid;
    }

    .thumb {
      width: 150px;
      aspect-ratio: 16 / 9;
      object-fit: cover;
      border-radius: 10px;
      background: #0d1118;
    }

    .title {
      font-weight: 750;
      line-height: 1.3;
    }

    .meta {
      color: #9fa9bd;
      margin-top: 6px;
      font-size: 13px;
    }

    .fine {
      margin-top: 22px;
      color: #747f94;
      font-size: 12px;
      line-height: 1.5;
    }

    @media (max-width: 560px) {
      .actions {
        grid-template-columns: 1fr;
      }

      .preview {
        grid-template-columns: 1fr;
      }

      .thumb {
        width: 100%;
      }
    }
  </style>
</head>

<body>

  <main class="card">

    <h1>VideoFetch</h1>

    <p class="sub">
      Paste a public video URL, preview it, then download the best available version.
    </p>

    <label for="url">Video URL</label>

    <input
      id="url"
      type="url"
      placeholder="https://example.com/video..."
      autocomplete="off"
    />

    <label for="password">
      App password
      <span style="opacity:.6">
        (only if you set one on Render)
      </span>
    </label>

    <input
      id="password"
      type="password"
      placeholder="Optional"
      autocomplete="current-password"
    />

    <div class="actions">

      <button
        class="info-btn"
        id="infoBtn"
      >
        Preview
      </button>

      <button
        class="download-btn"
        id="downloadBtn"
      >
        Download video
      </button>

    </div>

    <div
      id="status"
      class="status"
    ></div>

    <section
      id="preview"
      class="preview"
    >

      <img
        id="thumb"
        class="thumb"
        alt="Video thumbnail"
      />

      <div>

        <div
          id="title"
          class="title"
        ></div>

        <div
          id="meta"
          class="meta"
        ></div>

      </div>

    </section>

    <div class="fine">
      Use this only for videos you own or have permission to download.
      DRM-protected, private, paywalled, or login-only media is intentionally
      not bypassed.
    </div>

  </main>

<script>

const $ = (id) => document.getElementById(id);

const urlInput = $('url');
const passwordInput = $('password');
const statusEl = $('status');
const infoBtn = $('infoBtn');
const downloadBtn = $('downloadBtn');

passwordInput.value =
  localStorage.getItem('videofetch-password') || '';

passwordInput.addEventListener(
  'change',
  () =>
    localStorage.setItem(
      'videofetch-password',
      passwordInput.value
    )
);

function headers() {

  const h = {
    'Content-Type': 'application/json'
  };

  if (passwordInput.value) {
    h['X-App-Password'] = passwordInput.value;
  }

  return h;
}

function getUrl() {

  const url = urlInput.value.trim();

  if (!url) {
    throw new Error('Paste a video URL first.');
  }

  return url;
}

function fmtDuration(seconds) {

  if (!seconds) {
    return 'Duration unknown';
  }

  const h = Math.floor(seconds / 3600);
  const m = Math.floor((seconds % 3600) / 60);
  const s = Math.floor(seconds % 60);

  return h
    ? `${h}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`
    : `${m}:${String(s).padStart(2,'0')}`;
}

async function apiError(res) {

  try {

    const data = await res.json();

    return (
      data.detail ||
      JSON.stringify(data)
    );

  } catch {

    return `Request failed (${res.status})`;

  }
}

infoBtn.addEventListener(
  'click',
  async () => {

    try {

      const url = getUrl();

      infoBtn.disabled = true;

      statusEl.textContent =
        'Checking video…';

      const res = await fetch(
        '/api/info',
        {
          method: 'POST',
          headers: headers(),
          body: JSON.stringify({ url })
        }
      );

      if (!res.ok) {
        throw new Error(
          await apiError(res)
        );
      }

      const data = await res.json();

      $('title').textContent =
        data.title;

      $('meta').textContent =
        `${data.site} • ${fmtDuration(data.duration)}`;

      if (data.thumbnail) {

        $('thumb').src =
          data.thumbnail;

        $('thumb').style.display =
          '';

      } else {

        $('thumb').style.display =
          'none';

      }

      $('preview')
        .classList
        .add('show');

      statusEl.textContent =
        'Ready to download.';

    } catch (err) {

      statusEl.textContent =
        err.message;

    } finally {

      infoBtn.disabled =
        false;

    }

  }
);

downloadBtn.addEventListener(
  'click',
  async () => {

    try {

      const url = getUrl();

      downloadBtn.disabled =
        true;

      infoBtn.disabled =
        true;

      statusEl.textContent =
        'Downloading and preparing the file on the server…';

      const res = await fetch(
        '/api/download',
        {
          method: 'POST',
          headers: headers(),
          body: JSON.stringify({ url })
        }
      );

      if (!res.ok) {
        throw new Error(
          await apiError(res)
        );
      }

      const blob =
        await res.blob();

      const disposition =
        res.headers.get(
          'content-disposition'
        ) || '';

      const utf8 =
        disposition.match(
          /filename\*=UTF-8''([^;]+)/i
        );

      const regular =
        disposition.match(
          /filename="?([^";]+)"?/i
        );

      let filename =
        utf8
          ? decodeURIComponent(utf8[1])
          : (
              regular
                ? regular[1]
                : 'video.mp4'
            );

      const objectUrl =
        URL.createObjectURL(blob);

      const a =
        document.createElement('a');

      a.href =
        objectUrl;

      a.download =
        filename;

      document.body.appendChild(a);

      a.click();

      a.remove();

      URL.revokeObjectURL(
        objectUrl
      );

      statusEl.textContent =
        'Download ready.';

    } catch (err) {

      statusEl.textContent =
        err.message;

    } finally {

      downloadBtn.disabled =
        false;

      infoBtn.disabled =
        false;

    }

  }
);

</script>

</body>
</html>
